<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261021" />
<link rel="stylesheet" href="../css/components.css?v=20261021c" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Dashboard</h1>
        <p class="subtitle">Your plans, sales, and claims at a glance</p>
      </div>
    </div>

    <div class="dev-tool-bar" id="pendingBar" style="display:none;align-items:center;justify-content:space-between;gap:12px;">
      <span id="pendingBarText"><strong>Pending approval.</strong> An admin needs to approve your organization before you can publish plans or handle claims. You can still explore the console.</span>
      <button class="btn btn-sm btn-outline" id="pendingBarBtn" style="flex:none;">View details</button>
    </div>
    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;" class="detail-grid">
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:18px;">Premium Trend</h3>
        <div class="bars" id="chartBars"></div>
        <div class="bars-labels" id="chartLabels"></div>
      </div>
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:14px;">Recent claims</h3>
        <div id="recentClaims"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261021";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261021";
import { mountIcons } from "../js/icons.js?v=20261021";
import { listTransactions, listClaims, listPlans } from "../js/data.js?v=20261021";
import { money, moneyExact, number, statusBadge, escapeHtml, timeAgo, toast, setBusy, statCard, plainCard, trendDelta, pointDelta, sumInMonth, countInMonth, monthBounds, rateOf } from "../js/ui.js?v=20261021";

mountSidebarNav({ role: "partner", active: "dashboard" });
const session = await requireRole("partner", "login.html");

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  showStatusBar(session.profile.status);
  const params = new URLSearchParams(location.search);
  if (params.get("welcome")) toast("Welcome to Voya! Your organization is now in the queue for admin approval.", "success");
  await load();
}

// Doubles as this page's "notification button" (the admin side's
// equivalent is the bell on admin/overview.html) — only an
// approved/pending/suspended partner ever sees the Dashboard at all (a
// rejected/blocked one is redirected to Notifications before this runs),
// so this only ever needs to tell those three apart.
function showStatusBar(status) {
  if (status === "approved") return;
  const text = status === "suspended"
    ? "<strong>Account suspended.</strong> You won't be able to publish plans or handle claims until an admin re-approves your account."
    : "<strong>Pending approval.</strong> An admin needs to approve your organization before you can publish plans or handle claims. You can still explore the console.";
  document.getElementById("pendingBarText").innerHTML = text;
  document.getElementById("pendingBar").style.display = "flex";
  document.getElementById("pendingBarBtn").addEventListener("click", () => { location.href = "notifications.html"; });
}

async function load() {
  const [txns, claims, plans] = await Promise.all([
    listTransactions(session.uid), listClaims(session.uid), listPlans(session.uid),
  ]);

  const paid = txns.filter((t) => t.status === "paid");
  const gross = paid.reduce((s, t) => s + (Number(t.premium) || 0), 0);
  const pending = claims.filter((c) => c.status === "new" || c.status === "under_review").length;
  const approved = claims.filter((c) => c.status === "approved").length;
  const rate = claims.length ? Math.round((approved / claims.length) * 1000) / 10 : 0;

  const grossDelta = trendDelta(
    sumInMonth(paid, "createdAt", (t) => Number(t.premium) || 0, 0),
    sumInMonth(paid, "createdAt", (t) => Number(t.premium) || 0, 1),
  );
  const soldDelta = trendDelta(countInMonth(paid, "createdAt", 0), countInMonth(paid, "createdAt", 1));
  const { start: thisMonthStart } = monthBounds(0);
  const { start: lastMonthStart, end: lastMonthEnd } = monthBounds(1);
  const claimDateOf = (c) => (c.createdAt?.toDate ? c.createdAt.toDate() : null);
  const claimsThisMonth = claims.filter((c) => { const d = claimDateOf(c); return d && d >= thisMonthStart; });
  const claimsLastMonth = claims.filter((c) => { const d = claimDateOf(c); return d && d >= lastMonthStart && d < lastMonthEnd; });
  const rateDelta = pointDelta(rateOf(claimsThisMonth, (c) => c.status === "approved"), rateOf(claimsLastMonth, (c) => c.status === "approved"));

  document.getElementById("statGrid").innerHTML = [
    statCard("Gross premium", money(gross), "coin", grossDelta),
    statCard("Policies sold", number(paid.length), "shield-check", soldDelta),
    plainCard("Pending claims", number(pending)),
    statCard("Approval rate", `${rate}%`, "percent", rateDelta),
  ].join("");

  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ label: d.toLocaleDateString("en-MY", { month: "short" }), key: `${d.getFullYear()}-${d.getMonth()}`, revenue: 0 });
  }
  paid.forEach((t) => {
    if (!t.createdAt?.toDate) return;
    const d = t.createdAt.toDate();
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find((m) => m.key === key);
    if (m) m.revenue += Number(t.premium) || 0;
  });
  const max = Math.max(1, ...months.map((m) => m.revenue));
  document.getElementById("chartBars").innerHTML = months.map((m, i) => `<div class="bar-col"><div class="bar${i % 2 ? " alt" : ""}" style="height:${Math.max(6, (m.revenue / max) * 100)}%"></div></div>`).join("");
  document.getElementById("chartLabels").innerHTML = months.map((m) => `<span>${m.label}</span>`).join("");

  const recent = claims.slice(0, 5);
  document.getElementById("recentClaims").innerHTML = recent.length
    ? recent.map((c) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--border);">
          <div>
            <div style="font-weight:700;font-size:13.5px;color:var(--text-900);">${escapeHtml(c.policyholderName || "—")}</div>
            <div class="muted small">${escapeHtml(c.claimRef)} · ${timeAgo(c.createdAt)}</div>
          </div>
          ${statusBadge(c.status)}
        </div>`).join("")
    : `<p class="muted small">No claims yet.</p>`;

  mountIcons(document);
}
</script>
</body>
</html>
