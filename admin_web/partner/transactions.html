<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261111a" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Transactions</h1>
        <p class="subtitle">Every policy sold through Voya</p>
      </div>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div class="filter-bar">
      <div class="search-input-wrap"><span data-icon="search"></span><input class="input" id="searchInput" placeholder="Search reference or customer…" /></div>
      <select class="select" id="statusFilter">
        <option value="">All status</option>
        <option value="paid">Paid</option>
      </select>
      <select class="select" id="planFilter">
        <option value="">All plans</option>
      </select>
      <select class="select" id="destinationFilter">
        <option value="">All destinations</option>
      </select>
      <div class="inline-flex" style="gap:6px;">
        <input type="date" class="input" id="purchasedFrom" style="width:150px;" title="Purchased from" />
        <span class="muted small">to</span>
        <input type="date" class="input" id="purchasedTo" style="width:150px;" title="Purchased to" />
      </div>
      <select class="select" id="sortFilter">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
        <option value="price_desc">Premium: high to low</option>
        <option value="price_asc">Premium: low to high</option>
      </select>
    </div>

    <div class="table-wrap scroll-x">
      <table class="data-table">
        <thead><tr><th>Reference</th><th>Customer</th><th>Destination</th><th>Premium</th><th>Status</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span data-icon="swap" class="icon-lg"></span>
        <div class="h3" id="emptyTitle">No transactions yet</div>
        <p class="small" id="emptyBody">Sales made through Voya will show up here.</p>
      </div>
    </div>
    <div class="table-foot">
      <p class="small muted" id="resultsLabel"></p>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="txnModal">
  <div class="modal">
    <div class="modal-head"><h3 class="h2">Transaction detail</h3><button class="modal-close" data-close><span data-icon="x"></span></button></div>
    <div id="txnModalBody"></div>
  </div>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261115a";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261114a";
import { mountIcons } from "../js/icons.js?v=20261106c";
import { listTransactions } from "../js/data.js?v=20261114c";
import { money, moneyExact, number, fullDate, statusBadge, escapeHtml, paginate, renderPager, statCard, plainCard, trendDelta, countBefore, sumBefore, monthBounds, openModal, closeModal, wireModalDismiss } from "../js/ui.js?v=20261115a";

mountSidebarNav({ role: "partner", active: "transactions" });
const session = await requireRole("partner", "login.html");
let items = [], filtered = [], page = 1;
const PAGE_SIZE = 8;

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  wireModalDismiss();
  await load();
}

async function load() {
  items = await listTransactions(session.uid);
  const paid = items.filter((t) => t.status === "paid");
  const gross = paid.reduce((s, t) => s + (Number(t.premium) || 0), 0);
  const { start: thisMonthStart } = monthBounds(0);
  const totalDelta = trendDelta(items.length, countBefore(items, "createdAt", thisMonthStart));
  const paidDelta = trendDelta(paid.length, countBefore(paid, "createdAt", thisMonthStart));
  const grossDelta = trendDelta(gross, sumBefore(paid, "createdAt", (t) => Number(t.premium) || 0, thisMonthStart));
  document.getElementById("statGrid").innerHTML = [
    statCard("Total transactions", number(items.length), "swap", totalDelta),
    statCard("Paid", number(paid.length), "check-circle", paidDelta),
    statCard("Gross premium", money(gross), "coin", grossDelta),
  ].join("");
  populateDropdownFilters();
  applyFilters();
  mountIcons(document);
}

function populateDropdownFilters() {
  const planSelect = document.getElementById("planFilter");
  const plans = [...new Set(items.map((t) => (t.planName || "").trim()).filter(Boolean))].sort();
  const currentPlan = planSelect.value;
  planSelect.innerHTML = '<option value="">All plans</option>' + plans.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
  planSelect.value = currentPlan;

  const destSelect = document.getElementById("destinationFilter");
  const destinations = [...new Set(items.map((t) => (t.destination || "").trim()).filter(Boolean))].sort();
  const currentDest = destSelect.value;
  destSelect.innerHTML = '<option value="">All destinations</option>' + destinations.map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
  destSelect.value = currentDest;
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const plan = document.getElementById("planFilter").value;
  const destination = document.getElementById("destinationFilter").value;
  const purchasedFrom = document.getElementById("purchasedFrom").value ? new Date(document.getElementById("purchasedFrom").value) : null;
  const purchasedTo = document.getElementById("purchasedTo").value ? new Date(document.getElementById("purchasedTo").value + "T23:59:59") : null;
  filtered = items.filter((t) => {
    const matchesQ = !q || (t.customerName || "").toLowerCase().includes(q) || (t.txnRef || t.id || "").toLowerCase().includes(q);
    const matchesStatus = !status || t.status === status;
    const matchesPlan = !plan || (t.planName || "").trim() === plan;
    const matchesDest = !destination || (t.destination || "").trim() === destination;
    const purchasedAt = t.createdAt?.toDate ? t.createdAt.toDate() : null;
    const matchesFrom = !purchasedFrom || (purchasedAt && purchasedAt >= purchasedFrom);
    const matchesTo = !purchasedTo || (purchasedAt && purchasedAt <= purchasedTo);
    return matchesQ && matchesStatus && matchesPlan && matchesDest && matchesFrom && matchesTo;
  });
  filtered = sortTxns(filtered, document.getElementById("sortFilter").value);
  page = 1;
  renderTable();
}

function sortTxns(list, sort) {
  const sorted = [...list];
  const dateOf = (t) => (t.createdAt?.toDate ? t.createdAt.toDate().getTime() : 0);
  if (sort === "price_desc") sorted.sort((a, b) => (Number(b.premium) || 0) - (Number(a.premium) || 0));
  else if (sort === "price_asc") sorted.sort((a, b) => (Number(a.premium) || 0) - (Number(b.premium) || 0));
  else if (sort === "date_asc") sorted.sort((a, b) => dateOf(a) - dateOf(b));
  else sorted.sort((a, b) => dateOf(b) - dateOf(a)); // date_desc, and the default
  return sorted;
}

function renderTable() {
  const { pageItems, pages, total } = paginate(filtered, page, PAGE_SIZE);
  const body = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");
  if (!pageItems.length) {
    body.innerHTML = "";
    empty.style.display = "block";
    const hasAnyItems = items.length > 0;
    document.getElementById("emptyTitle").textContent = hasAnyItems ? "No matches found" : "No transactions yet";
    document.getElementById("emptyBody").textContent = hasAnyItems
      ? "Try adjusting your search, filters, or date range."
      : "Sales made through Voya will show up here.";
  }
  else {
    empty.style.display = "none";
    body.innerHTML = pageItems.map((t) => `
      <tr style="cursor:pointer;" data-open-txn="${t.id}">
        <td class="cell-strong">${escapeHtml(t.txnRef || t.id)}</td>
        <td>${escapeHtml(t.customerName || "—")}</td>
        <td class="muted">${escapeHtml(t.destination || "—")}</td>
        <td class="muted">${moneyExact(t.premium)}</td>
        <td>${statusBadge(t.status)}</td>
      </tr>`).join("");
    body.querySelectorAll("[data-open-txn]").forEach((row) => row.addEventListener("click", () => openTxnDetail(row.dataset.openTxn)));
  }
  document.getElementById("resultsLabel").textContent = total
    ? `Showing ${(page - 1) * PAGE_SIZE + 1} to ${Math.min(page * PAGE_SIZE, total)} of ${total} results` : "No results";
  renderPager("pagination", { page, pages }, (n) => { page = n; renderTable(); });
  mountIcons(document);
}

function openTxnDetail(id) {
  const t = items.find((x) => x.id === id);
  if (!t) return;
  const row = (label, value) => `<div class="field" style="margin-bottom:12px;"><label>${label}</label><p class="value">${value}</p></div>`;
  document.getElementById("txnModalBody").innerHTML = `
    <div class="form-grid">
      ${row("Reference", escapeHtml(t.txnRef || t.id))}
      ${row("Status", statusBadge(t.status))}
      ${row("Policy number", escapeHtml(t.policyNumber || "—"))}
      ${row("Customer (buyer)", escapeHtml(t.customerName || "—"))}
      ${row("Customer email", escapeHtml(t.customerEmail || "—"))}
      ${row("Traveller", escapeHtml(t.travellerName || "—"))}
      ${row("Traveller passport/ID", escapeHtml(t.travellerIdNumber || "—"))}
      ${row("Traveller email", escapeHtml(t.travellerEmail || "—"))}
      ${row("Traveller phone", escapeHtml(t.travellerPhone || "—"))}
      ${row("Plan", escapeHtml(t.planName || "—"))}
      ${row("Coverage", escapeHtml(t.coverage || "—"))}
      ${row("Premium", moneyExact(t.premium))}
      ${row("Destination", escapeHtml(t.destination || "—"))}
      ${row("Channel", escapeHtml(t.channel || "—"))}
      ${row("Purchased", fullDate(t.createdAt))}
    </div>
    ${t.isDemoSeed ? `<p class="muted small" style="margin-top:4px;">This is seeded demo data.</p>` : ""}`;
  mountIcons(document.getElementById("txnModalBody"));
  openModal("txnModal");
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("planFilter").addEventListener("change", applyFilters);
document.getElementById("destinationFilter").addEventListener("change", applyFilters);
document.getElementById("purchasedFrom").addEventListener("change", applyFilters);
document.getElementById("purchasedTo").addEventListener("change", applyFilters);
document.getElementById("sortFilter").addEventListener("change", applyFilters);
</script>
</body>
</html>
