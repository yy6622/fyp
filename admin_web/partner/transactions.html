<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261006b" />
<link rel="stylesheet" href="../css/components.css?v=20261006b" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Transactions</h1>
        <p class="subtitle">Every policy sold through Voya</p>
      </div>
      <button class="btn btn-primary" id="exportBtn"><span data-icon="download"></span>Export</button>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div class="filter-bar">
      <div class="search-input-wrap"><span data-icon="search"></span><input class="input" id="searchInput" placeholder="Search…" /></div>
      <select class="select" id="statusFilter">
        <option value="">All status</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <div class="table-wrap scroll-x">
      <table class="data-table">
        <thead><tr><th>Reference</th><th>Customer</th><th>Destination</th><th>Premium</th><th>Status</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span data-icon="swap" class="icon-lg"></span>
        <div class="h3">No transactions yet</div>
        <p class="small">Sales made through Voya will show up here.</p>
      </div>
    </div>
    <div class="table-foot">
      <p class="small muted" id="resultsLabel"></p>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261007e";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261007e";
import { mountIcons } from "../js/icons.js?v=20261007e";
import { listTransactions } from "../js/data.js?v=20261007e";
import { money, moneyExact, number, statusBadge, escapeHtml, paginate, renderPager, statCard, plainCard, trendDelta, countBefore, sumBefore, monthBounds } from "../js/ui.js?v=20261007e";

mountSidebarNav({ role: "partner", active: "transactions" });
const session = await requireRole("partner", "login.html");
let items = [], filtered = [], page = 1;
const PAGE_SIZE = 8;

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  await load();
}

async function load() {
  items = await listTransactions(session.uid);
  const paid = items.filter((t) => t.status === "paid");
  const pending = items.filter((t) => t.status === "pending");
  const gross = paid.reduce((s, t) => s + (Number(t.premium) || 0), 0);
  const { start: thisMonthStart } = monthBounds(0);
  const totalDelta = trendDelta(items.length, countBefore(items, "createdAt", thisMonthStart));
  const paidDelta = trendDelta(paid.length, countBefore(paid, "createdAt", thisMonthStart));
  const grossDelta = trendDelta(gross, sumBefore(paid, "createdAt", (t) => Number(t.premium) || 0, thisMonthStart));
  document.getElementById("statGrid").innerHTML = [
    statCard("Total transactions", number(items.length), "swap", totalDelta),
    statCard("Paid", number(paid.length), "check-circle", paidDelta),
    plainCard("Pending", number(pending.length)),
    statCard("Gross premium", money(gross), "coin", grossDelta),
  ].join("");
  applyFilters();
  mountIcons(document);
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  filtered = items.filter((t) => (!q || (t.customerName || "").toLowerCase().includes(q) || (t.txnRef || "").toLowerCase().includes(q)) && (!status || t.status === status));
  page = 1;
  renderTable();
}

function renderTable() {
  const { pageItems, pages, total } = paginate(filtered, page, PAGE_SIZE);
  const body = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");
  if (!pageItems.length) { body.innerHTML = ""; empty.style.display = "block"; }
  else {
    empty.style.display = "none";
    body.innerHTML = pageItems.map((t) => `
      <tr>
        <td class="cell-strong">${escapeHtml(t.txnRef || t.id)}</td>
        <td>${escapeHtml(t.customerName || "—")}</td>
        <td class="muted">${escapeHtml(t.destination || "—")}</td>
        <td class="muted">${moneyExact(t.premium)}</td>
        <td>${statusBadge(t.status)}</td>
      </tr>`).join("");
  }
  document.getElementById("resultsLabel").textContent = total
    ? `Showing ${(page - 1) * PAGE_SIZE + 1} to ${Math.min(page * PAGE_SIZE, total)} of ${total} results` : "No results";
  renderPager("pagination", { page, pages }, (n) => { page = n; renderTable(); });
  mountIcons(document);
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("exportBtn").addEventListener("click", () => {
  if (!filtered.length) return;
  const rows = [["Reference", "Customer", "Destination", "Premium (RM)", "Status"]];
  filtered.forEach((t) => rows.push([t.txnRef || t.id, t.customerName || "", t.destination || "", (Number(t.premium) || 0).toFixed(2), t.status || ""]));
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `voya-transactions-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
