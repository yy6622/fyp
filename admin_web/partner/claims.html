<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Refunds & Claims — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261111a" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Refunds & Claims</h1>
        <p class="subtitle">Review claims and refunds filed by travellers</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-type="claim">Claims</button>
      <button class="tab-btn" data-type="refund">Refunds</button>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div class="filter-bar">
      <div class="search-input-wrap"><span data-icon="search"></span><input class="input" id="searchInput" placeholder="Search policyholder or reference…" /></div>
      <select class="select" id="statusFilter">
        <option value="">All status</option>
        <option value="new">New</option>
        <option value="under_review">Under review</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <select class="select" id="planFilter">
        <option value="">All plans</option>
      </select>
      <div class="inline-flex" style="gap:6px;">
        <input type="date" class="input" id="filedFrom" style="width:150px;" title="Filed from" />
        <span class="muted small">to</span>
        <input type="date" class="input" id="filedTo" style="width:150px;" title="Filed to" />
      </div>
      <select class="select" id="sortFilter">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
        <option value="amount_desc">Amount: high to low</option>
        <option value="amount_asc">Amount: low to high</option>
      </select>
    </div>

    <div class="table-wrap scroll-x">
      <table class="data-table">
        <thead><tr><th id="refColHead">Claim ID</th><th>Policyholder</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span data-icon="doc-text" class="icon-lg"></span>
        <div class="h3" id="emptyTitle">No claims yet</div>
        <p class="small" id="emptyBody">Claims submitted for your plans will show up here.</p>
      </div>
    </div>
    <div class="table-foot">
      <p class="small muted" id="resultsLabel"></p>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="detailModal">
  <div class="modal" style="max-width:640px;">
    <div class="modal-head">
      <div>
        <h3 class="h2" id="detailTitle">Claim</h3>
        <div id="detailStatusBadge" style="margin-top:6px;"></div>
      </div>
      <button class="modal-close" data-close><span data-icon="x"></span></button>
    </div>
    <div id="detailModalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="imgModal">
  <div class="modal" style="max-width:720px;padding:16px;">
    <div class="modal-head" style="margin-bottom:8px;">
      <h3 class="h3">Document</h3>
      <button class="modal-close" data-close><span data-icon="x"></span></button>
    </div>
    <img id="imgModalImg" src="" alt="Document" style="display:block;width:100%;max-height:75vh;object-fit:contain;border-radius:10px;" />
  </div>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261115a";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261114a";
import { mountIcons } from "../js/icons.js?v=20261106c";
import { listClaims, listRefunds, getClaim, getRefund, updateClaimStatus, updateRefundStatus, setClaimAmount } from "../js/data.js?v=20261119ins1";
import { number, moneyExact, statusBadge, escapeHtml, paginate, renderPager, statCard, trendDelta, countByStatusInMonth, fullDate, toast, confirmDialog, openModal, closeModal, wireModalDismiss } from "../js/ui.js?v=20261115a";

mountSidebarNav({ role: "partner", active: "claims" });
const session = await requireRole("partner", "login.html");
const isApproved = session?.profile.status === "approved";
let items = [], filtered = [], page = 1;
let type = new URLSearchParams(location.search).get("type") === "refund" ? "refund" : "claim";
const PAGE_SIZE = 8;

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  wireModalDismiss();
  setTab(type);
  await load();
  // Deep link from notifications.html -- open straight into a specific
  // claim/refund's detail modal instead of landing on the bare list.
  const openId = new URLSearchParams(location.search).get("open");
  if (openId) openDetail(openId);
}

function setTab(nextType) {
  type = nextType;
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.type === type));
  const isClaim = type === "claim";
  document.getElementById("refColHead").textContent = isClaim ? "Claim ID" : "Refund ID";
  document.getElementById("emptyTitle").textContent = isClaim ? "No claims yet" : "No refunds yet";
  document.getElementById("emptyBody").textContent = isClaim
    ? "Claims submitted for your plans will show up here."
    : "Refunds issued against your plans will show up here.";
  mountIcons(document);
}

document.querySelectorAll(".tab-btn").forEach((b) => b.addEventListener("click", async () => {
  if (b.dataset.type === type) return;
  setTab(b.dataset.type);
  history.replaceState(null, "", `claims.html?type=${type}`);
  page = 1;
  await load();
}));

async function load() {
  items = type === "claim" ? await listClaims(session.uid) : await listRefunds(session.uid);
  const prefix = type === "claim" ? "New claims" : "New refunds";
  const newDelta = trendDelta(countByStatusInMonth(items, "new", 0), countByStatusInMonth(items, "new", 1));
  const reviewDelta = trendDelta(countByStatusInMonth(items, "under_review", 0), countByStatusInMonth(items, "under_review", 1));
  const approvedDelta = trendDelta(countByStatusInMonth(items, "approved", 0), countByStatusInMonth(items, "approved", 1));
  const rejectedDelta = trendDelta(countByStatusInMonth(items, "rejected", 0), countByStatusInMonth(items, "rejected", 1));
  document.getElementById("statGrid").innerHTML = [
    statCard(prefix, number(items.filter((c) => c.status === "new").length), "flag", newDelta),
    statCard("Under review", number(items.filter((c) => c.status === "under_review").length), "clock", reviewDelta),
    statCard("Approved", number(items.filter((c) => c.status === "approved").length), "check-circle", approvedDelta),
    statCard("Rejected", number(items.filter((c) => c.status === "rejected").length), "x-circle", rejectedDelta),
  ].join("");
  populatePlanFilter();
  applyFilters();
  mountIcons(document);
}

function populatePlanFilter() {
  const select = document.getElementById("planFilter");
  const plans = [...new Set(items.map((c) => (c.planName || "").trim()).filter(Boolean))].sort();
  const current = select.value;
  select.innerHTML = '<option value="">All plans</option>' + plans.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("");
  select.value = current;
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const plan = document.getElementById("planFilter").value;
  const filedFrom = document.getElementById("filedFrom").value ? new Date(document.getElementById("filedFrom").value) : null;
  const filedTo = document.getElementById("filedTo").value ? new Date(document.getElementById("filedTo").value + "T23:59:59") : null;
  const sort = document.getElementById("sortFilter").value;
  const refField = type === "claim" ? "claimRef" : "refundRef";
  filtered = items.filter((c) => {
    const matchesQ = !q || (c.policyholderName || "").toLowerCase().includes(q) || (c[refField] || "").toLowerCase().includes(q);
    const matchesStatus = !status || c.status === status;
    const matchesPlan = !plan || (c.planName || "").trim() === plan;
    const filedAt = c.createdAt?.toDate ? c.createdAt.toDate() : null;
    const matchesFrom = !filedFrom || (filedAt && filedAt >= filedFrom);
    const matchesTo = !filedTo || (filedAt && filedAt <= filedTo);
    return matchesQ && matchesStatus && matchesPlan && matchesFrom && matchesTo;
  });
  filtered = sortClaims(filtered, sort);
  page = 1;
  renderTable();
}

function sortClaims(list, sort) {
  const sorted = [...list];
  const dateOf = (c) => (c.createdAt?.toDate ? c.createdAt.toDate().getTime() : 0);
  if (sort === "amount_desc") sorted.sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0));
  else if (sort === "amount_asc") sorted.sort((a, b) => (Number(a.amount) || 0) - (Number(b.amount) || 0));
  else if (sort === "date_asc") sorted.sort((a, b) => dateOf(a) - dateOf(b));
  else sorted.sort((a, b) => dateOf(b) - dateOf(a)); // date_desc, and the default
  return sorted;
}

function renderTable() {
  const { pageItems, pages, total } = paginate(filtered, page, PAGE_SIZE);
  const body = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");
  const refField = type === "claim" ? "claimRef" : "refundRef";
  if (!pageItems.length) {
    body.innerHTML = "";
    empty.style.display = "block";
    const hasAnyItems = items.length > 0;
    document.getElementById("emptyTitle").textContent = hasAnyItems ? "No matches found" : (type === "claim" ? "No claims yet" : "No refunds yet");
    document.getElementById("emptyBody").textContent = hasAnyItems
      ? "Try adjusting your search, filters, or date range."
      : (type === "claim" ? "Claims submitted for your plans will show up here." : "Refunds issued against your plans will show up here.");
  }
  else {
    empty.style.display = "none";
    body.innerHTML = pageItems.map((c) => `
      <tr style="cursor:pointer;" data-open="${c.id}">
        <td class="cell-strong">${escapeHtml(c[refField])}</td>
        <td>${escapeHtml(c.policyholderName || "—")}</td>
        <td class="muted">${escapeHtml(c.planName || "—")}</td>
        <td class="muted">${type === "claim" && (c.amount == null || c.amountSetByPartner !== true) ? "Awaiting assessment" : moneyExact(c.amount)}</td>
        <td>${statusBadge(c.status)}</td>
      </tr>`).join("");
    body.querySelectorAll("[data-open]").forEach((row) => row.addEventListener("click", () => openDetail(row.dataset.open)));
  }
  document.getElementById("resultsLabel").textContent = total
    ? `Showing ${(page - 1) * PAGE_SIZE + 1} to ${Math.min(page * PAGE_SIZE, total)} of ${total} results` : "No results";
  renderPager("pagination", { page, pages }, (n) => { page = n; renderTable(); });
  mountIcons(document);
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("planFilter").addEventListener("change", applyFilters);
document.getElementById("filedFrom").addEventListener("change", applyFilters);
document.getElementById("filedTo").addEventListener("change", applyFilters);
document.getElementById("sortFilter").addEventListener("change", applyFilters);

async function openDetail(id) {
  const record = type === "claim" ? await getClaim(id) : await getRefund(id);
  if (!record || record.partnerId !== session.uid) {
    toast(`Couldn't find that ${type}.`, "error");
    return;
  }
  renderDetail(id, record);
  openModal("detailModal");
}

function safeDocumentUrl(raw) {
  try {
    const url = new URL(String(raw));
    return (url.protocol === "https:" || url.protocol === "http:") ? escapeHtml(url.href) : "#";
  } catch (_) { return "#"; }
}

function renderDetail(id, record) {
  const noun = type === "claim" ? "Claim" : "Refund";
  const ref = record[type === "claim" ? "claimRef" : "refundRef"];
  document.getElementById("detailTitle").textContent = `${noun} ${ref}`;
  document.getElementById("detailStatusBadge").innerHTML = statusBadge(record.status);
  const isFinal = record.status === "approved" || record.status === "rejected";
  const timeline = (record.timeline || []).slice().reverse();
  const docs = record.documents || [];
  document.getElementById("detailModalBody").innerHTML = `
    <div class="card detail-card">
      <h3 class="h3">Policyholder</h3>
      <p class="value">${escapeHtml(record.policyholderName || "—")} · ${escapeHtml(record.policyholderEmail || "—")}</p>
    </div>
    <div class="card detail-card">
      <h3 class="h3">Policy</h3>
      <p class="value">${escapeHtml(record.planName || "—")}</p>
    </div>
    <div class="card detail-card">
      <h3 class="h3">${noun} details</h3>
      <p class="value">${escapeHtml(record.category || "—")}</p>
      <p class="small muted" style="margin-top:8px;white-space:pre-wrap;">${escapeHtml(type === "claim" ? (record.description || "No incident description") : (record.reason || "No additional refund reason"))}</p>
      ${type === "claim" ? ((isFinal || !isApproved)
        ? `<p class="value" style="margin-top:8px;">Assessed claim amount: ${record.amount == null || record.amountSetByPartner !== true ? "Not assessed" : moneyExact(record.amount)}</p>`
        : `<label for="assessedClaimAmount" style="display:block;margin-top:12px;">Assessed Claim Amount (partner only)</label>
           <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
             <input class="input" id="assessedClaimAmount" type="number" min="0.01" step="0.01" style="width:180px;" placeholder="Enter amount" value="${record.amount == null || record.amountSetByPartner !== true ? "" : Number(record.amount)}" />
             <button class="btn btn-outline btn-sm" id="saveClaimAmountBtn">Save amount</button>
           </div>`)
        : `<p class="value" style="margin-top:8px;">Requested refund: ${moneyExact(record.amount)}</p>`}
    </div>
    <div class="card detail-card">
      <h3 class="h3">Documents</h3>
      ${docs.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">${docs.map((u, i) => `<a href="${safeDocumentUrl(u)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">Document ${i + 1} (view)</a>`).join("")}</div>` : `<p class="value muted">No documents attached.</p>`}
    </div>
    <div class="card detail-card">
      <h3 class="h3">Review timeline</h3>
      ${timeline.length ? timeline.map((t) => `
        <div style="padding:8px 0;border-top:1px solid var(--border);">
          <p class="value" style="font-weight:700;">${escapeHtml((t.status || "").replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase()))}</p>
          <p class="muted small">${fullDate(t.at)}${t.note ? " · " + escapeHtml(t.note) : ""}</p>
        </div>`).join("") : `<p class="value muted">No activity yet.</p>`}
    </div>
    <div class="form-actions" style="margin-top:4px;">
      ${isApproved ? (isFinal ? `
      <p class="muted small">This ${type} has already been ${escapeHtml(record.status)} — no further action is needed.</p>
      ` : `
      <button class="btn btn-danger-outline" id="rejectBtn"><span data-icon="x" data-icon-size="14"></span>Reject ${type}</button>
      <button class="btn btn-primary" id="approveBtn"><span data-icon="check-circle" data-icon-size="14"></span>Approve</button>
      `) : `<p class="muted small">Your account is ${escapeHtml(session?.profile.status || "pending")} — review actions unlock once an admin approves your account.</p>`}
    </div>`;
  mountIcons(document.getElementById("detailModalBody"));

  document.getElementById("detailModalBody").querySelectorAll("[data-view-doc]").forEach((img) => {
    img.addEventListener("click", () => openImg(img.dataset.viewDoc));
  });

  if (isApproved && !isFinal && type === "claim") {
    document.getElementById("saveClaimAmountBtn").addEventListener("click", async () => {
      const value = Number(document.getElementById("assessedClaimAmount").value);
      if (!Number.isFinite(value) || value <= 0) { toast("Enter a positive claim amount.", "error"); return; }
      try {
        await setClaimAmount(id, value);
        toast("Claim amount saved.", "success");
        renderDetail(id, await getClaim(id));
        await load();
      } catch (err) { toast(err.message || "Could not save claim amount.", "error"); }
    });
  }
  if (isApproved && !isFinal) {
    document.getElementById("rejectBtn").addEventListener("click", () => act(id, "rejected", `${noun} rejected`, true));
    document.getElementById("approveBtn").addEventListener("click", () => act(id, "approved", "Approved for payout", true));
  }
}

function openImg(url) {
  document.getElementById("imgModalImg").src = url;
  openModal("imgModal");
}

async function act(id, status, note, needsConfirm) {
  const getFn = type === "claim" ? getClaim : getRefund;
  const updateFn = type === "claim" ? updateClaimStatus : updateRefundStatus;
  const latest = await getFn(id);
  if (!latest || latest.partnerId !== session.uid) {
    toast("You cannot review another partner's request.", "error");
    return;
  }
  let assessedAmount = null;
  if (type === "claim" && status === "approved") {
    const input = document.getElementById("assessedClaimAmount");
    assessedAmount = Number(input?.value);
    if (!input || !input.value.trim() || !Number.isFinite(assessedAmount) || assessedAmount <= 0) {
      toast("Enter the assessed claim amount before approving.", "error");
      return;
    }
  }
  if (latest.status === "approved" || latest.status === "rejected") {
    toast(`This ${type} was already decided — refreshing.`, "error");
    renderDetail(id, latest);
    await load();
    return;
  }
  if (needsConfirm) {
    const ok = await confirmDialog({
      title: status === "approved" ? `Approve this ${type}?` : `Reject this ${type}?`,
      body: status === "approved" ? "The policyholder will be marked as approved for payout." : `The policyholder will be notified the ${type} was rejected.`,
      confirmText: status === "approved" ? "Approve" : "Reject", danger: status !== "approved",
    });
    if (!ok) return;
  }
  try {
    if (type === "claim") await updateFn(id, status, note, assessedAmount);
    else await updateFn(id, status, note);
    toast(`${type === "claim" ? "Claim" : "Refund"} updated.`, "success");
    const fresh = await getFn(id);
    renderDetail(id, fresh);
    await load();
  } catch (err) {
    toast(err.message || `Couldn't update this ${type}.`, "error");
  }
}

</script>
</body>
</html>
