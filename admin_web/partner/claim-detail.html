<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claim Detail — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Voya</div>
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <a href="claims.html" class="inline-flex" style="color:var(--text-500);font-weight:700;font-size:13.5px;margin-bottom:10px;">
          <span data-icon="arrow-left" data-icon-size="14"></span>Back to claims
        </a>
        <h1 class="h1" id="claimTitle">Claim</h1>
        <div id="claimStatusBadge" style="margin-top:8px;"></div>
      </div>
    </div>

    <div id="body">
      <div class="skeleton" style="height:200px;"></div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js";
import { mountIcons } from "../js/icons.js";
import { getClaim, updateClaimStatus } from "../js/data.js";
import { moneyExact, statusBadge, escapeHtml, fullDate, toast, setBusy, confirmDialog } from "../js/ui.js";

mountSidebarNav({ role: "partner", active: "claims" });
const session = await requireRole("partner", "login.html");
const claimId = new URLSearchParams(location.search).get("id");

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  if (!claimId) {
    document.getElementById("body").innerHTML = `<p class="muted">No claim selected.</p>`;
  } else {
    await load();
  }
}

async function load() {
  const claim = await getClaim(claimId);
  if (!claim || claim.partnerId !== session.uid) {
    document.getElementById("body").innerHTML = `<div class="empty-state"><span data-icon="doc-text" class="icon-lg"></span><div class="h3">Claim not found</div></div>`;
    mountIcons(document);
    return;
  }
  document.getElementById("claimTitle").textContent = `Claim ${claim.claimRef}`;
  document.getElementById("claimStatusBadge").innerHTML = statusBadge(claim.status);

  const timeline = (claim.timeline || []).slice().reverse();
  document.getElementById("body").innerHTML = `
    <div class="detail-grid">
      <div>
        <div class="card detail-card">
          <h3 class="h3">Policyholder</h3>
          <p class="value">${escapeHtml(claim.policyholderName || "—")} · ${escapeHtml(claim.policyholderEmail || "—")}</p>
        </div>
        <div class="card detail-card">
          <h3 class="h3">Policy</h3>
          <p class="value">${escapeHtml(claim.planName || "—")}</p>
        </div>
        <div class="card detail-card">
          <h3 class="h3">Claim details</h3>
          <p class="value">${moneyExact(claim.amount)} · ${escapeHtml(claim.category || "—")}</p>
        </div>
        <div class="card detail-card">
          <h3 class="h3">Documents</h3>
          <p class="value">${(claim.documents || []).length ? claim.documents.map(escapeHtml).join(" · ") : "No documents attached."}</p>
        </div>
        <div class="card detail-card">
          <h3 class="h3">Review timeline</h3>
          ${timeline.length ? timeline.map((t) => `
            <div style="padding:8px 0;border-top:1px solid var(--border);">
              <p class="value" style="font-weight:700;">${escapeHtml((t.status || "").replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase()))}</p>
              <p class="muted small">${fullDate(t.at)}${t.note ? " · " + escapeHtml(t.note) : ""}</p>
            </div>`).join("") : `<p class="value muted">No activity yet.</p>`}
        </div>
        <div class="card detail-card">
          <h3 class="h3">Assignee</h3>
          <p class="value">${escapeHtml(claim.assignee?.name || "Unassigned")} · ${escapeHtml(claim.assignee?.role || "—")}</p>
        </div>
      </div>
      <div></div>
    </div>
    <div class="form-actions" style="margin-top:4px;">
      <button class="btn btn-danger-outline" id="rejectBtn"><span data-icon="x" data-icon-size="14"></span>Reject claim</button>
      <button class="btn btn-outline" id="infoBtn"><span data-icon="eye" data-icon-size="14"></span>Request info</button>
      <button class="btn btn-primary" id="approveBtn"><span data-icon="check-circle" data-icon-size="14"></span>Approve</button>
    </div>`;
  mountIcons(document);

  document.getElementById("rejectBtn").addEventListener("click", () => act("rejected", "Claim rejected", true));
  document.getElementById("infoBtn").addEventListener("click", () => act("under_review", "Requested more information from the policyholder", false));
  document.getElementById("approveBtn").addEventListener("click", () => act("approved", "Approved for payout", true));
}

async function act(status, note, needsConfirm) {
  if (needsConfirm) {
    const ok = await confirmDialog({
      title: status === "approved" ? "Approve this claim?" : "Reject this claim?",
      body: status === "approved" ? "The policyholder will be marked as approved for payout." : "The policyholder will be notified the claim was rejected.",
      confirmText: status === "approved" ? "Approve" : "Reject", danger: status !== "approved",
    });
    if (!ok) return;
  }
  try {
    await updateClaimStatus(claimId, status, note);
    toast("Claim updated.", "success");
    await load();
  } catch (err) {
    toast(err.message || "Couldn't update claim.", "error");
  }
}
</script>
</body>
</html>
