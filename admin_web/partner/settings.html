<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Settings — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Voya</div>
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Partner workspace</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">System Settings</h1>
        <p class="subtitle">Account and workspace preferences</p>
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:20px;">
      <h3 class="h3" style="margin-bottom:6px;">Account</h3>
      <p class="subtitle" style="margin-bottom:18px;" id="accountLine">—</p>
      <button class="btn btn-outline" id="resetPwBtn"><span data-icon="mail"></span>Send password reset email</button>
    </div>

    <div class="card card-pad" style="margin-bottom:20px;">
      <h3 class="h3" style="margin-bottom:6px;">Approval status</h3>
      <p class="subtitle" style="margin-bottom:14px;">Your organization's status with the Voya platform team.</p>
      <div id="statusBadgeWrap"></div>
    </div>

    <div class="card card-pad">
      <h3 class="h3" style="margin-bottom:6px;">Demo data</h3>
      <p class="subtitle" style="margin-bottom:18px;">Remove the sample plans, transactions and claims created by "Seed demo data" — your real data is never touched.</p>
      <button class="btn btn-danger-outline" id="clearBtn"><span data-icon="trash"></span>Clear demo data</button>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js";
import { mountIcons } from "../js/icons.js";
import { resetPassword } from "../js/auth-guard.js";
import { clearDemoData } from "../js/seed.js";
import { statusBadge, toast, setBusy, confirmDialog } from "../js/ui.js";

mountSidebarNav({ role: "partner", active: "settings" });
const session = await requireRole("partner", "login.html");

if (session) {
  setSidebarUser({ displayName: session.profile.companyName || "Partner", roleLabel: `${session.profile.companyName || "Insurance"} · Insurance Partner` });
  document.getElementById("accountLine").textContent = session.user.email;
  document.getElementById("statusBadgeWrap").innerHTML = statusBadge(session.profile.status === "approved" ? "active" : session.profile.status);
  mountIcons(document);
}

document.getElementById("resetPwBtn").addEventListener("click", async (e) => {
  setBusy(e.currentTarget, true, "Sending…");
  try {
    await resetPassword(session.user.email);
    toast("Password reset email sent.", "success");
  } catch (err) {
    toast(err.message || "Couldn't send email.", "error");
  } finally {
    setBusy(e.currentTarget, false);
  }
});

document.getElementById("clearBtn").addEventListener("click", async (e) => {
  const ok = await confirmDialog({ title: "Clear all demo data?", body: "This deletes every sample plan, transaction and claim tagged as demo data. This can't be undone.", confirmText: "Clear demo data", danger: true });
  if (!ok) return;
  setBusy(e.currentTarget, true, "Clearing…");
  try {
    const count = await clearDemoData();
    toast(`Removed ${count} demo record(s).`, "success");
  } catch (err) {
    toast(err.message || "Couldn't clear demo data.", "error");
  } finally {
    setBusy(e.currentTarget, false);
  }
});
</script>
</body>
</html>
