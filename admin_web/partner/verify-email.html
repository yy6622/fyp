<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Email — Voya Insurance Partner</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
<link rel="stylesheet" href="../css/auth.css?v=20261111a" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-side">
    <img class="brand" src="../img/voya-logo-white.png" alt="Voya" />
    <h1>One more step.</h1>
    <p class="lede">Confirm your work email so we know your partner account is really yours.</p>
    <div class="auth-points">
      <div class="auth-point"><span class="tick"><span data-icon="check-circle" data-icon-size="15"></span></span>Keeps your account secure</div>
      <div class="auth-point"><span class="tick"><span data-icon="check-circle" data-icon-size="15"></span></span>Takes less than a minute</div>
      <div class="auth-point"><span class="tick"><span data-icon="check-circle" data-icon-size="15"></span></span>Same step every traveller takes too</div>
    </div>
  </div>
  <div class="auth-main">
    <div class="auth-card" id="card">
      <h2>Verify your email</h2>
      <p class="lede" id="lede">Checking your account…</p>
    </div>
  </div>
</div>

<script type="module">
import { mountIcons } from "../js/icons.js?v=20261106c";
import { auth } from "../js/firebase-config.js?v=20261007";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { emailCodeStepUp } from "../js/ui.js?v=20261115a";

mountIcons(document);
const lede = document.getElementById("lede");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.replace("login.html");
    return;
  }
  await user.reload().catch(() => {});
  if (user.emailVerified) {
    location.replace("dashboard.html");
    return;
  }
  lede.textContent = `We need to confirm ${user.email} is really yours before you can use your partner account.`;
  const verified = await emailCodeStepUp("signup", {
    title: "Verify your work email",
    body: `We've emailed a 6-digit code to ${user.email}. Enter it below to activate your partner account.`,
  });
  if (verified) {
    location.replace("dashboard.html?welcome=1");
    return;
  }
  await signOut(auth);
  location.replace("login.html");
});
</script>
</body>
</html>
