<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Management — Voya Admin</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261111a" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Administrator</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">User Management</h1>
        <p class="subtitle">Manage users, roles, and access permissions</p>
      </div>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div class="filter-bar">
      <div class="search-input-wrap"><span data-icon="search"></span><input class="input" id="searchInput" placeholder="Search username, email…" /></div>
      <select class="select" id="statusFilter">
        <option value="">All status</option>
        <option value="active">Active</option>
        <option value="suspended">Suspended</option>
      </select>
      <select class="select" id="countryFilter">
        <option value="">All countries</option>
      </select>
      <select class="select" id="sortFilter">
        <option value="joined_desc">Joined: newest first</option>
        <option value="joined_asc">Joined: oldest first</option>
      </select>
    </div>

    <div class="table-wrap scroll-x">
      <table class="data-table">
        <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th><th>Status</th><th></th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span data-icon="user" class="icon-lg"></span>
        <div class="h3">No users found</div>
        <p class="small">Try a different search or filter.</p>
      </div>
    </div>
    <div class="table-foot">
      <p class="small muted" id="resultsLabel"></p>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261106b";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261114a";
import { mountIcons } from "../js/icons.js?v=20261106c";
import { listUsers, setUserRoleStatus } from "../js/data.js?v=20261114c";
import { number, shortDate, fullDate, statusBadge, initials, escapeHtml, paginate, renderPager, toast, setBusy, statCard, plainCard, trendDelta, countBefore, monthBounds, detailDialog, confirmDialog } from "../js/ui.js?v=20261113a";

mountSidebarNav({ role: "admin", active: "users" });
const session = await requireRole("admin", "login.html");
let users = [];
let filtered = [];
let page = 1;
const PAGE_SIZE = 8;

if (session) {
  setSidebarUser({ displayName: session.profile.name || "Admin", roleLabel: "Administrator" });
  await load();
}

async function load() {
  users = await listUsers();
  users.forEach((u) => { u.status = u.status || "active"; u.role = u.role || "user"; });
  renderStats();
  populateCountryFilter();
  applyFilters();
}

function populateCountryFilter() {
  const select = document.getElementById("countryFilter");
  const countries = [...new Set(users.map((u) => (u.country || "").trim()).filter(Boolean))].sort();
  const current = select.value;
  select.innerHTML = '<option value="">All countries</option>' + countries.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  select.value = current;
}

function renderStats() {
  const active = users.filter((u) => u.status === "active");
  const suspended = users.filter((u) => u.status === "suspended").length;
  // Real deltas (js/ui.js) — Suspended is a live status snapshot with no
  // honest baseline, so it stays a plainCard.
  const { start: thisMonthStart } = monthBounds(0);
  const totalDelta = trendDelta(users.length, countBefore(users, "createdAt", thisMonthStart));
  const activeDelta = trendDelta(active.length, countBefore(active, "createdAt", thisMonthStart));
  document.getElementById("statGrid").innerHTML = [
    statCard("Total users", number(users.length), "user", totalDelta),
    statCard("Active", number(active.length), "sparkle", activeDelta),
    plainCard("Suspended", number(suspended), "x-circle"),
  ].join("");
  mountIcons(document);
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  const country = document.getElementById("countryFilter").value;
  const sort = document.getElementById("sortFilter").value;
  filtered = users.filter((u) => {
    const matchesQ = !q || (u.name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q);
    const matchesStatus = !status || u.status === status;
    const matchesCountry = !country || (u.country || "").trim() === country;
    return matchesQ && matchesStatus && matchesCountry;
  });
  const joinedAtOf = (u) => (u.createdAt?.toDate ? u.createdAt.toDate().getTime() : 0);
  filtered.sort((a, b) => (sort === "joined_asc" ? joinedAtOf(a) - joinedAtOf(b) : joinedAtOf(b) - joinedAtOf(a)));
  page = 1;
  renderTable();
}

function renderTable() {
  const { pageItems, pages, total } = paginate(filtered, page, PAGE_SIZE);
  const body = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");
  if (!pageItems.length) {
    body.innerHTML = "";
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
    body.innerHTML = pageItems.map((u) => `
      <tr style="cursor:pointer;" data-open="${u.id}">
        <td>
          <div class="inline-flex">
            <div class="avatar-fallback">${initials(u.name)}</div>
            <span class="cell-strong">${escapeHtml(u.name || "Unnamed")}</span>
          </div>
        </td>
        <td class="muted">${escapeHtml(u.email || "—")}</td>
        <td>${escapeHtml((u.role || "user").replace(/^\w/, (c) => c.toUpperCase()))}</td>
        <td class="muted">${shortDate(u.createdAt)}</td>
        <td>${statusBadge(u.status)}</td>
        <td><div class="row-actions">${u.status === "suspended"
          ? `<button class="btn btn-primary btn-sm" data-activate="${u.id}">Activate</button>`
          : `<button class="btn btn-danger-outline btn-sm" data-suspend="${u.id}">Suspend</button>`}</div></td>
      </tr>`).join("");
    body.querySelectorAll("[data-open]").forEach((row) => row.addEventListener("click", (e) => {
      if (e.target.closest(".row-actions")) return;
      openDetail(row.dataset.open);
    }));
    body.querySelectorAll("[data-suspend]").forEach((btn) => btn.addEventListener("click", (e) => { e.stopPropagation(); setUserStatusUi(btn.dataset.suspend, "suspended", btn); }));
    body.querySelectorAll("[data-activate]").forEach((btn) => btn.addEventListener("click", (e) => { e.stopPropagation(); setUserStatusUi(btn.dataset.activate, "active", btn); }));
  }
  document.getElementById("resultsLabel").textContent = total
    ? `Showing ${(page - 1) * PAGE_SIZE + 1} to ${Math.min(page * PAGE_SIZE, total)} of ${total} results`
    : "No results";
  renderPager("pagination", { page, pages }, (n) => { page = n; renderTable(); });
  mountIcons(document);
}

function openDetail(uid) {
  const u = users.find((x) => x.id === uid);
  if (!u) return;
  detailDialog({
    title: u.name || "Unnamed",
    subtitle: u.email || "—",
    rows: [
      { label: "Phone", value: escapeHtml(u.phone || "—") },
      { label: "Country", value: escapeHtml(u.country || "—") },
      { label: "Role", value: escapeHtml((u.role || "user").replace(/^\w/, (c) => c.toUpperCase())) },
      { label: "Status", value: statusBadge(u.status) },
      { label: "Joined", value: fullDate(u.createdAt) },
    ],
    actions: [
      u.status === "suspended"
        ? { text: "Activate", className: "btn-primary", onClick: () => setUserStatusUi(uid, "active") }
        : { text: "Suspend", className: "btn-danger-outline", onClick: () => setUserStatusUi(uid, "suspended") },
    ],
  });
}

async function setUserStatusUi(uid, status, btn) {
  if (status === "suspended") {
    const ok = await confirmDialog({ title: "Suspend this user?", body: "They won't be able to sign in until you re-activate them.", confirmText: "Suspend", danger: true });
    if (!ok) return;
  }
  setBusy(btn, true, "Working…");
  try {
    await setUserRoleStatus(uid, { status });
    const u = users.find((x) => x.id === uid);
    if (u) u.status = status;
    renderStats();
    applyFilters();
    toast(status === "active" ? "User activated." : "User suspended.", "success");
  } catch (err) {
    toast(err.message || "Couldn't update user.", "error");
    setBusy(btn, false);
  }
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("countryFilter").addEventListener("change", applyFilters);
document.getElementById("sortFilter").addEventListener("change", applyFilters);
</script>
</body>
</html>
