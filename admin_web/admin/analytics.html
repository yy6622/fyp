<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics & Reporting — Voya Admin</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261006b" />
<link rel="stylesheet" href="../css/components.css?v=20261006b" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Administrator</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Analytics & Reporting</h1>
        <p class="subtitle">Track performance and export reports</p>
      </div>
      <button class="btn btn-primary" id="exportBtn"><span data-icon="download"></span>Export report</button>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;" class="detail-grid">
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:18px;">Revenue & Policy Trend</h3>
        <div class="bars" id="trendBars"></div>
        <div class="bars-labels" id="trendLabels"></div>
      </div>
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:18px;">Top Insurance Partners</h3>
        <div class="rank-list" id="partnerRank"></div>
      </div>
    </div>

    <div class="card card-pad" style="margin-top:20px;">
      <h3 class="h3" style="margin-bottom:18px;">Top Destinations</h3>
      <div class="table-wrap scroll-x" style="border:none;">
        <table class="data-table">
          <thead><tr><th>Destination</th><th>Policies</th><th>Revenue</th><th>Share</th></tr></thead>
          <tbody id="destBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261007f";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261007f";
import { mountIcons } from "../js/icons.js?v=20261007f";
import { listTransactions, listClaims, listUsers } from "../js/data.js?v=20261007f";
import { money, moneyExact, number, escapeHtml, statCard, trendDelta, pointDelta, sumInMonth, countInMonth, monthBounds, rateOf } from "../js/ui.js?v=20261007f";

mountSidebarNav({ role: "admin", active: "analytics" });
const session = await requireRole("admin", "login.html");
let allTxns = [];

if (session) {
  setSidebarUser({ displayName: session.profile.name || "Admin", roleLabel: "Administrator" });
  await load();
}

async function load() {
  const [txns, claims, users] = await Promise.all([listTransactions(), listClaims(), listUsers()]);
  allTxns = txns;
  const paid = txns.filter((t) => t.status === "paid");
  const revenue = paid.reduce((s, t) => s + (Number(t.premium) || 0), 0);
  const approvedCount = claims.filter((c) => c.status === "approved").length;
  const approvalRate = claims.length ? Math.round((approvedCount / claims.length) * 1000) / 10 : 0;
  const activeTravellers = users.filter((u) => u.status !== "suspended").length;

  // Real month-over-month deltas (js/ui.js) — same pairing as Platform
  // Overview's identical 4 metrics in admin/reports.html. Active
  // travellers has no historical status log to replay, so its delta
  // approximates "how many of today's active travellers had already
  // signed up before this month" using real signup dates.
  const { start: thisMonthStart } = monthBounds(0);
  const revenueDelta = trendDelta(
    sumInMonth(paid, "createdAt", (t) => Number(t.premium) || 0, 0),
    sumInMonth(paid, "createdAt", (t) => Number(t.premium) || 0, 1),
  );
  const policiesDelta = trendDelta(countInMonth(paid, "createdAt", 0), countInMonth(paid, "createdAt", 1));
  const { start: lastMonthStart, end: lastMonthEnd } = monthBounds(1);
  const claimDateOf = (c) => (c.createdAt?.toDate ? c.createdAt.toDate() : null);
  const claimsThisMonth = claims.filter((c) => { const d = claimDateOf(c); return d && d >= thisMonthStart; });
  const claimsLastMonth = claims.filter((c) => { const d = claimDateOf(c); return d && d >= lastMonthStart && d < lastMonthEnd; });
  const approvalRateDelta = pointDelta(rateOf(claimsThisMonth, (c) => c.status === "approved"), rateOf(claimsLastMonth, (c) => c.status === "approved"));
  const activeDelta = trendDelta(
    activeTravellers,
    users.filter((u) => {
      if (u.status === "suspended") return false;
      const d = u.createdAt?.toDate ? u.createdAt.toDate() : null;
      return d && d < thisMonthStart;
    }).length,
  );

  document.getElementById("statGrid").innerHTML = [
    statCard("Revenue", money(revenue), "coin", revenueDelta),
    statCard("Policies sold", number(paid.length), "shield-check", policiesDelta),
    statCard("Claims approved", `${approvalRate}%`, "check-circle", approvalRateDelta),
    statCard("Active travellers", number(activeTravellers), "user", activeDelta),
  ].join("");

  // Revenue & policy trend — last 6 months
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ label: d.toLocaleDateString("en-MY", { month: "short" }), key: `${d.getFullYear()}-${d.getMonth()}`, revenue: 0 });
  }
  paid.forEach((t) => {
    if (!t.createdAt?.toDate) return;
    const d = t.createdAt.toDate();
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find((m) => m.key === key);
    if (m) m.revenue += Number(t.premium) || 0;
  });
  const maxRev = Math.max(1, ...months.map((m) => m.revenue));
  document.getElementById("trendBars").innerHTML = months.map((m, i) => `<div class="bar-col"><div class="bar${i % 2 ? " alt" : ""}" style="height:${Math.max(6, (m.revenue / maxRev) * 100)}%"></div></div>`).join("");
  document.getElementById("trendLabels").innerHTML = months.map((m) => `<span>${m.label}</span>`).join("");

  // Top insurance partners by revenue. "Sales by Channel" used to live
  // here, but every real mobile-app purchase writes channel: "Mobile App"
  // (see lib/repositories/insurance_repository.dart) — only demo-seeded
  // rows ever vary it — so that chart collapsed to one meaningless,
  // unlabeled full-height bar once real data was in play. Partner/provider
  // genuinely varies, and this shows the real policy count + revenue per
  // partner as text, not just a bar with no visible number.
  const byProvider = {};
  paid.forEach((t) => {
    const name = t.providerName || "Unknown provider";
    byProvider[name] = byProvider[name] || { policies: 0, revenue: 0 };
    byProvider[name].policies++;
    byProvider[name].revenue += Number(t.premium) || 0;
  });
  const providerEntries = Object.entries(byProvider).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);
  document.getElementById("partnerRank").innerHTML = providerEntries.length
    ? providerEntries.map(([name, d], i) => `
        <div class="rank-row">
          <div class="rank-num">${i + 1}</div>
          <div><div class="rank-name">${escapeHtml(name)}</div><div class="rank-sub">${number(d.policies)} polic${d.policies === 1 ? "y" : "ies"} · ${moneyExact(d.revenue)}</div></div>
        </div>`).join("")
    : `<p class="muted small" style="padding:20px 0;">No policy sales recorded yet.</p>`;

  // Top destinations (by real transaction destinations)
  const byDest = {};
  paid.forEach((t) => {
    const dest = t.destination || "Unspecified";
    byDest[dest] = byDest[dest] || { policies: 0, revenue: 0 };
    byDest[dest].policies++;
    byDest[dest].revenue += Number(t.premium) || 0;
  });
  const totalRevenue = Object.values(byDest).reduce((s, d) => s + d.revenue, 0) || 1;
  const rows = Object.entries(byDest).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 6);
  document.getElementById("destBody").innerHTML = rows.length
    ? rows.map(([dest, d]) => `
        <tr>
          <td class="cell-strong">${escapeHtml(dest)}</td>
          <td class="muted">${number(d.policies)}</td>
          <td class="muted">${moneyExact(d.revenue)}</td>
          <td class="muted">${((d.revenue / totalRevenue) * 100).toFixed(1)}%</td>
        </tr>`).join("")
    : `<tr><td colspan="4" class="muted" style="text-align:center;padding:30px 0;">No policy sales recorded yet.</td></tr>`;

  mountIcons(document);
}

document.getElementById("exportBtn").addEventListener("click", () => {
  if (!allTxns.length) { return; }
  const rows = [["Reference", "Customer", "Provider", "Destination", "Channel", "Premium (RM)", "Status"]];
  allTxns.forEach((t) => rows.push([t.txnRef || t.id, t.customerName || "", t.providerName || "", t.destination || "", t.channel || "", (Number(t.premium) || 0).toFixed(2), t.status || ""]));
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `voya-analytics-report-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
