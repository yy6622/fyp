<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Voya Admin</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261006b" />
<link rel="stylesheet" href="../css/base.css?v=20261006b" />
<link rel="stylesheet" href="../css/layout.css?v=20261111a" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Administrator</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Dashboard</h1>
        <p class="subtitle">Monitor platform performance and key metrics</p>
      </div>
      <div class="inline-flex" style="gap:10px;align-items:flex-start;">
        <button class="btn btn-outline bell-btn" id="notifBell" title="Notifications — click to review">
          <span data-icon="bell"></span><span class="bell-dot" id="notifBellDot" style="display:none;"></span>
        </button>
      </div>
    </div>

    <div class="stat-grid" id="statGrid">
      <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
      <div class="card stat-card"><div class="skeleton" style="height:70px;"></div></div>
    </div>

    <div style="display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start;" class="detail-grid">
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:18px;">User Engagement Analytics</h3>
        <div class="bars" id="chartBars"></div>
        <div class="bars-labels" id="chartLabels"></div>
      </div>
      <div class="card card-pad">
        <h3 class="h3" style="margin-bottom:14px;">Top Destinations</h3>
        <div class="rank-list" id="topDestinations"></div>
      </div>
    </div>

  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261106b";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261114a";
import { mountIcons } from "../js/icons.js?v=20261106c";
import { listUsers, listAllPosts, countPendingPartners, listReportedPosts, countFlaggedReviews, countPlaceSuggestions } from "../js/data.js?v=20261114c";
import { number, statCard, plainCard, trendDelta, countBetween } from "../js/ui.js?v=20261113a";

mountSidebarNav({ role: "admin", active: "overview" });
const session = await requireRole("admin", "login.html");
if (session) {
  setSidebarUser({ displayName: session.profile.name || "Admin", roleLabel: "Administrator" });
  await loadOverview();
  loadNotifBell(); // separate from the stats above — shouldn't block them, and shouldn't be blocked by them
}

async function loadNotifBell() {
  // Bell button itself is always visible now (Nov 2026 — the admin
  // wants a permanent way into notifications.html, not a button that
  // disappears entirely when nothing's pending); only the red dot on it
  // is conditional, same idea as sidebar.js's own nav-dot.
  const bell = document.getElementById("notifBell");
  bell.addEventListener("click", () => { location.href = "notifications.html"; });
  const [pendingPartners, reportedPosts, flaggedReviews, placeSuggestions] = await Promise.all([
    countPendingPartners().catch(() => 0),
    listReportedPosts().then((p) => p.length).catch(() => 0),
    countFlaggedReviews().catch(() => 0),
    countPlaceSuggestions().catch(() => 0),
  ]);
  const moderationCount = reportedPosts + flaggedReviews + placeSuggestions;
  const total = pendingPartners + moderationCount;
  const dot = document.getElementById("notifBellDot");
  dot.style.display = total > 0 ? "" : "none";
  if (total > 0) {
    const parts = [];
    if (pendingPartners) parts.push(`${pendingPartners} new partner request${pendingPartners === 1 ? "" : "s"}`);
    if (moderationCount) parts.push(`${moderationCount} item${moderationCount === 1 ? "" : "s"} to moderate`);
    bell.title = `${parts.join(" · ")} — click to review`;
  } else {
    bell.title = "No new notifications — click to review";
  }
}

async function loadOverview() {
  const [users, posts, pendingPartners, reportedPosts, flaggedReviews, placeSuggestions] = await Promise.all([
    listUsers(), listAllPosts(),
    countPendingPartners().catch(() => 0),
    listReportedPosts().then((p) => p.length).catch(() => 0),
    countFlaggedReviews().catch(() => 0),
    countPlaceSuggestions().catch(() => 0),
  ]);

  // ---- Top stat row ----
  // Kept deliberately lean: Total/Active/Suspended users already have a
  // full breakdown on the Users page (same filters, same numbers), so
  // repeating them here would just be the same three cards in two
  // places. What's actually left for a dashboard to usefully show,
  // without echoing any other admin page, is (a) the one user trend
  // Users doesn't track -- new sign-ups -- and (b) a single
  // across-the-board "does anything need me right now" number: every
  // other page only ever shows its own slice of that (Insurance shows
  // its own pending partners, Content Moderation shows its own pending
  // posts/reviews, Places shows its own pending suggestions), nobody
  // else adds them all up into one figure.
  const now = new Date();
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 86400000);
  const sixtyDaysAgo = new Date(now.getTime() - 60 * 86400000);
  const newSignups = users.filter((u) => u.createdAt?.toDate && u.createdAt.toDate().getTime() > thirtyDaysAgo.getTime()).length;

  // New Sign-ups is a rolling 30-day window, so it's compared to the 30
  // days before that rather than a calendar month.
  const newSignupsDelta = trendDelta(countBetween(users, "createdAt", thirtyDaysAgo, now), countBetween(users, "createdAt", sixtyDaysAgo, thirtyDaysAgo), "the previous 30 days");
  // Same four counts the notification bell below already tracks (kept
  // as its own independent fetch, same as the bell -- see loadNotifBell
  // -- so neither one can block or break the other); a queue-style
  // total like this has no honest "vs last month" baseline, so it's a
  // plainCard, same reasoning as Suspended used to get.
  const needsAttention = pendingPartners + reportedPosts + flaggedReviews + placeSuggestions;

  document.getElementById("statGrid").innerHTML = [
    statCard("New Sign-ups", number(newSignups), "sparkle", newSignupsDelta),
    plainCard("Needs Attention", number(needsAttention), "bell"),
  ].join("");
  // ---- Bar chart: users joined per month (last 6 months) ----
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({ label: d.toLocaleDateString("en-MY", { month: "short" }), key: `${d.getFullYear()}-${d.getMonth()}`, count: 0 });
  }
  users.forEach((u) => {
    if (!u.createdAt?.toDate) return;
    const d = u.createdAt.toDate();
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find((m) => m.key === key);
    if (m) m.count++;
  });
  const max = Math.max(1, ...months.map((m) => m.count));
  document.getElementById("chartBars").innerHTML = months
    .map((m, i) => `<div class="bar-col" data-tooltip="${m.label}: ${number(m.count)} new user${m.count === 1 ? "" : "s"}"><div class="bar${i % 2 ? " alt" : ""}" style="height:${Math.max(6, (m.count / max) * 100)}%"></div></div>`)
    .join("");
  document.getElementById("chartLabels").innerHTML = months.map((m) => `<span>${m.label}</span>`).join("");

  // ---- Top destinations: ranked by actual traveller engagement, not
  // catalog size. Attractions/restaurants have no view tracking at all,
  // so community post views (summed per post.location — the one real
  // "how much do travellers actually look at this place" signal in the
  // app, also used by Reports' Community Post Analysis tab) stand in for
  // "most viewed destination".
  const byLocationViews = {};
  posts.forEach((p) => {
    const loc = p.location || "Unknown";
    byLocationViews[loc] = (byLocationViews[loc] || 0) + (Number(p.viewCount) || 0);
  });
  const top = Object.entries(byLocationViews)
    .filter(([, views]) => views > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
  document.getElementById("topDestinations").innerHTML = top.length
    ? top.map(([loc, views], i) => `
        <div class="rank-row">
          <div class="rank-num">${i + 1}</div>
          <div><div class="rank-name">${loc}</div><div class="rank-sub">${number(views)} view${views === 1 ? "" : "s"}</div></div>
        </div>`).join("")
    : `<p class="muted small">No community post views recorded yet.</p>`;

  mountIcons(document);
}
</script>
</body>
</html>
