<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Insurance Management — Voya Admin</title>
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/layout.css" />
<link rel="stylesheet" href="../css/components.css" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Voya</div>
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Administrator</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <h1 class="h1">Insurance Management</h1>
        <p class="subtitle">Monitor all insurance transactions</p>
      </div>
      <button class="btn btn-primary" id="exportBtn"><span data-icon="download"></span>Export</button>
    </div>

    <div class="dev-tool-bar" id="devBar" style="display:none;">
      <span>No insurance data yet — seed some demo transactions, plans and claims to explore this page.</span>
      <button class="btn btn-outline btn-sm" id="seedBtn"><span data-icon="refresh" data-icon-size="14"></span>Seed demo data</button>
    </div>

    <div class="stat-grid" id="statGrid"><div class="skeleton" style="height:90px;grid-column:1/-1;"></div></div>

    <div class="filter-bar">
      <div class="search-input-wrap"><span data-icon="search"></span><input class="input" id="searchInput" placeholder="Search…" /></div>
      <select class="select" id="statusFilter">
        <option value="">All status</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>

    <div class="table-wrap scroll-x">
      <table class="data-table">
        <thead><tr><th>Reference</th><th>Customer</th><th>Provider</th><th>Premium</th><th>Status</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="5"><div class="skeleton" style="height:40px;"></div></td></tr></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span data-icon="swap" class="icon-lg"></span>
        <div class="h3">No transactions yet</div>
        <p class="small">Real purchases from partners will appear here.</p>
      </div>
    </div>
    <div class="table-foot">
      <p class="small muted" id="resultsLabel"></p>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js";
import { mountIcons } from "../js/icons.js";
import { listTransactions, listClaims, listPartners } from "../js/data.js";
import { seedAdminDemoData } from "../js/seed.js";
import { money, moneyExact, number, statusBadge, escapeHtml, paginate, toast, setBusy } from "../js/ui.js";

mountSidebarNav({ role: "admin", active: "insurance" });
const session = await requireRole("admin", "login.html");
let txns = [], filtered = [], page = 1;
const PAGE_SIZE = 8;

if (session) {
  setSidebarUser({ displayName: session.profile.name || "Admin", roleLabel: "Administrator" });
  await load();
}

function statCard(label, value, icon) {
  return `<div class="card stat-card"><div class="stat-top"><div class="stat-icon"><span data-icon="${icon}"></span></div><div class="stat-label">${label}</div></div><div class="stat-value">${value}</div><div class="stat-delta">↑ 2.4% from last month</div></div>`;
}

async function load() {
  const [transactions, claims] = await Promise.all([listTransactions(), listClaims()]);
  txns = transactions;
  document.getElementById("devBar").style.display = txns.length ? "none" : "flex";

  const gross = txns.filter((t) => t.status === "paid").reduce((s, t) => s + (Number(t.premium) || 0), 0);
  const pendingClaims = claims.filter((c) => c.status === "new" || c.status === "under_review").length;
  const approvedCount = claims.filter((c) => c.status === "approved").length;
  const approvalRate = claims.length ? Math.round((approvedCount / claims.length) * 1000) / 10 : 0;

  document.getElementById("statGrid").innerHTML = [
    statCard("Gross premium", money(gross), "coin"),
    statCard("Policies sold", number(txns.filter((t) => t.status === "paid").length), "shield-check"),
    statCard("Pending claims", number(pendingClaims), "clock"),
    statCard("Approval rate", `${approvalRate}%`, "percent"),
  ].join("");
  applyFilters();
  mountIcons(document);
}

function applyFilters() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  filtered = txns.filter((t) => {
    const matchesQ = !q || (t.customerName || "").toLowerCase().includes(q) || (t.txnRef || "").toLowerCase().includes(q) || (t.providerName || "").toLowerCase().includes(q);
    return matchesQ && (!status || t.status === status);
  });
  page = 1;
  renderTable();
}

function renderTable() {
  const { pageItems, pages, total } = paginate(filtered, page, PAGE_SIZE);
  const body = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");
  if (!pageItems.length) { body.innerHTML = ""; empty.style.display = "block"; }
  else {
    empty.style.display = "none";
    body.innerHTML = pageItems.map((t) => `
      <tr>
        <td class="cell-strong">${escapeHtml(t.txnRef || t.id)}</td>
        <td>${escapeHtml(t.customerName || "—")}</td>
        <td class="muted">${escapeHtml(t.providerName || "—")}</td>
        <td class="muted">${moneyExact(t.premium)}</td>
        <td>${statusBadge(t.status)}</td>
      </tr>`).join("");
  }
  document.getElementById("resultsLabel").textContent = total
    ? `Showing ${(page - 1) * PAGE_SIZE + 1} to ${Math.min(page * PAGE_SIZE, total)} of ${total} results` : "No results";
  const pager = document.getElementById("pagination");
  let html = `<button class="page-btn" ${page === 1 ? "disabled" : ""} id="prevPage"><span data-icon="chevron-left" data-icon-size="14"></span></button>`;
  for (let i = 1; i <= pages; i++) html += `<button class="page-btn${i === page ? " active" : ""}" data-page="${i}">${i}</button>`;
  html += `<button class="page-btn" ${page === pages ? "disabled" : ""} id="nextPage"><span data-icon="chevron-right" data-icon-size="14"></span></button>`;
  pager.innerHTML = html;
  pager.querySelectorAll("[data-page]").forEach((b) => b.addEventListener("click", () => { page = Number(b.dataset.page); renderTable(); }));
  document.getElementById("prevPage")?.addEventListener("click", () => { page--; renderTable(); });
  document.getElementById("nextPage")?.addEventListener("click", () => { page++; renderTable(); });
  mountIcons(document);
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);

document.getElementById("seedBtn")?.addEventListener("click", async (e) => {
  setBusy(e.currentTarget, true, "Seeding…");
  try {
    const partners = await listPartners();
    const notes = await seedAdminDemoData(partners.filter((p) => p.status === "approved"));
    toast(notes.join(" · "), "success");
    await load();
  } catch (err) {
    toast(err.message || "Couldn't seed data.", "error");
  } finally {
    setBusy(e.currentTarget, false);
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  if (!filtered.length) { toast("Nothing to export."); return; }
  const rows = [["Reference", "Customer", "Provider", "Premium (RM)", "Status"]];
  filtered.forEach((t) => rows.push([t.txnRef || t.id, t.customerName || "", t.providerName || "", (Number(t.premium) || 0).toFixed(2), t.status || ""]));
  const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `voya-insurance-transactions-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
