<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — Voya Admin</title>
<link rel="stylesheet" href="../css/tokens.css?v=20261021" />
<link rel="stylesheet" href="../css/base.css?v=20261021" />
<link rel="stylesheet" href="../css/layout.css?v=20261111a" />
<link rel="stylesheet" href="../css/components.css?v=20261106g" />
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <img class="sidebar-brand" src="../img/voya-logo-white.png" alt="Voya" />
    <div class="sidebar-user">
      <div class="name" id="sbUserName">Loading…</div>
      <div class="role" id="sbUserRole">Administrator</div>
    </div>
    <nav class="nav" id="sidebarNav"></nav>
    <button class="sidebar-logout" id="logoutBtn"><span data-icon="log-out"></span>Log out</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <button class="menu-toggle" id="menuToggle"><span data-icon="menu"></span></button>
        <a href="overview.html" class="inline-flex" style="gap:4px;font-size:12.5px;color:var(--text-500);text-decoration:none;margin-bottom:4px;"><span data-icon="chevron-left" data-icon-size="12"></span>Back to Dashboard</a>
        <h1 class="h1">Notifications</h1>
        <p class="subtitle">Partner requests, reported content, and recent decisions — newest first</p>
      </div>
    </div>

    <div class="card card-pad" id="noticeSection"><div class="skeleton" style="height:90px;"></div></div>
  </main>
</div>

<script type="module">
import { requireRole } from "../js/auth-guard.js?v=20261106b";
import { mountSidebarNav, setSidebarUser } from "../js/sidebar.js?v=20261114a";
import { mountIcons } from "../js/icons.js?v=20261106c";
import { listPartners, listReportedPosts, listFlaggedReviews, listPlaceSuggestions, listDismissedNoticeKeys, dismissNotice, listSeenNoticeKeys, markNoticeSeen } from "../js/data.js?v=20261114c";
import {
  timeAgo, escapeHtml, toast, setBusy, reporterLabel,
} from "../js/ui.js?v=20261113a";

// No "Notifications" nav item in the sidebar anymore — this page is only
// reached from the Dashboard's bell button now, not a permanent tab (see
// js/sidebar.js). Highlighting "overview" keeps the Dashboard tab marked
// active while the admin is here, since that's conceptually where they
// came from and where the "Back to Dashboard" link above returns to.
mountSidebarNav({ role: "admin", active: "overview" });
const session = await requireRole("admin", "login.html");
let partners = [];
let reportedPosts = [];
let flaggedReviews = [];
let placeSuggestions = [];
let dismissedKeys = new Set();
let seenKeys = new Map(); // key -> seenAt Timestamp, for the already-decided-partner aging rule below
// An already-decided partner notice (kind "partner_decision") is just an
// FYI, not something left to act on, so it's allowed to fall off the feed
// on its own once the admin has actually seen it AND it's this old —
// same "read + 30 days" idea as the traveller app's own notification
// retention (see functions/notification_cleanup.js). Still-open notices
// (a pending partner request, an unresolved report/suggestion) are never
// aged out this way, however old or however long ago they were opened —
// only resolving them or dismissing them by hand removes those.
const MAX_DECIDED_NOTICE_AGE_DAYS = 30;

if (session) {
  setSidebarUser({ displayName: session.profile.name || "Admin", roleLabel: "Administrator" });
  await load();
  // Every notice click navigates away with location.href, and a lot of
  // browsers restore the page from the back/forward cache (bfcache) when
  // you hit Back afterwards -- that restores the exact DOM from before
  // the click, with the icon still showing its old unread color, instead
  // of re-running this script. Re-fetch and re-render whenever that
  // happens so the read state the click just wrote actually shows up.
  window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });
}

async function load() {
  const [p, posts, reviews, suggestions, dismissed, seen] = await Promise.all([
    listPartners(),
    listReportedPosts(),
    listFlaggedReviews().catch(() => []), // collectionGroup query — don't let a rules hiccup on this one break the whole page
    listPlaceSuggestions().catch(() => []),
    listDismissedNoticeKeys(),
    listSeenNoticeKeys().catch(() => new Map()),
  ]);
  partners = p;
  reportedPosts = posts;
  flaggedReviews = reviews;
  placeSuggestions = suggestions;
  dismissedKeys = dismissed;
  seenKeys = seen;
  renderNotices();
  mountIcons(document);
}

// One flat, chronological notice feed — new partner requests, reported
// posts/reviews, place suggestions, and already-decided partners are all
// just "things that happened", mixed together and sorted by time rather
// than split into separate category cards. Each kind still does the right
// thing on click (open the detail dialog, or jump to the full review flow
// on Content Moderation / Places Management) — only the layout is flat now.
function buildNotices() {
  const pending = partners.filter((p) => p.status === "pending" || !p.status);
  const decided = partners.filter((p) => p.status && p.status !== "pending");
  const notices = [];
  pending.forEach((p) => notices.push({ kind: "partner_request", id: p.id, at: p.createdAt, data: p }));
  reportedPosts.forEach((p) => notices.push({ kind: "post_report", id: p.id, at: p.reportedAt, data: p }));
  flaggedReviews.forEach((r) => notices.push({ kind: "review_report", id: r.id, at: r.reportedAt, data: r }));
  placeSuggestions.forEach((s) => notices.push({ kind: "suggestion", id: s.id, at: s.createdAt, data: s }));
  decided.forEach((p) => notices.push({ kind: "partner_decision", id: p.id, at: recentAt(p), data: p }));

  const decidedCutoffMs = Date.now() - MAX_DECIDED_NOTICE_AGE_DAYS * 24 * 60 * 60 * 1000;
  const visible = notices.filter((n) => {
    const key = `${n.kind}:${n.id}`;
    if (dismissedKeys.has(key)) return false;
    if (n.kind === "partner_decision") {
      const seenAt = seenKeys.get(key);
      const seenMs = seenAt?.seconds ? seenAt.seconds * 1000 : null;
      if (seenMs !== null && seenMs < decidedCutoffMs) return false;
    }
    return true;
  });
  visible.forEach((n) => { n.seen = seenKeys.has(`${n.kind}:${n.id}`); });
  visible.sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
  return visible;
}

function noticeMeta(n) {
  const d = n.data;
  switch (n.kind) {
    case "partner_request":
      return {
        icon: "building",
        title: `${escapeHtml(d.companyName || "—")} wants to become an insurance partner`,
        subtitle: `${escapeHtml(d.email || "—")} · registered ${timeAgo(d.createdAt)}`,
      };
    case "post_report":
      return {
        icon: "flag",
        title: `${escapeHtml(d.title || "Untitled post")} was reported`,
        subtitle: `Reported by ${escapeHtml(reporterLabel(d))} · ${timeAgo(d.reportedAt)} · ${escapeHtml(d.reportReason || "No reason given")}`,
      };
    case "review_report":
      return {
        icon: "flag",
        title: `Review on ${escapeHtml(d.parentName || "Unknown")} was reported`,
        subtitle: `Reported by ${escapeHtml(reporterLabel(d))} · ${timeAgo(d.reportedAt)} · ${escapeHtml(d.reportReason || "No reason given")}`,
      };
    case "suggestion":
      return {
        icon: "map-pin",
        title: `${escapeHtml(d.name || "New place suggestion")} was suggested as a new place`,
        subtitle: `Suggested by ${escapeHtml(d.authorName || "a traveller")} · ${timeAgo(d.createdAt)} · ${escapeHtml(d.location || "No location given")}`,
      };
    case "partner_decision": {
      const label = d.status === "approved" ? "approved" : d.status === "rejected" ? "rejected" : d.status === "suspended" ? "suspended" : d.status;
      return {
        icon: "building",
        title: `${escapeHtml(d.companyName || "—")}'s partner application was ${label}`,
        subtitle: timeAgo(recentAt(d)),
      };
    }
    default:
      return { icon: "bell", title: "—", subtitle: "" };
  }
}

// Read/unread is shown purely through the icon's color -- blue while
// unseen, grey once it's been opened -- not a tinted row background
// (tried that first; with every row the same teal wash it was all noise
// and no signal). Same idea as a classic mail client's unread dot, just
// recolors the icon that's already there instead of adding another one.
function renderNoticeRow(n) {
  const m = noticeMeta(n);
  const unseen = !n.seen;
  const iconBg = unseen ? "var(--blue-bg)" : "#F3F3F3";
  const iconColor = unseen ? "var(--blue-text)" : "var(--text-500)";
  return `
    <div class="inline-flex" style="justify-content:space-between;gap:12px;padding:14px;border:1px solid #ECECEC;border-radius:12px;cursor:pointer;" data-notice="${n.kind}:${n.id}">
      <div class="inline-flex" style="gap:12px;">
        <div style="width:38px;height:38px;border-radius:10px;background:${iconBg};display:flex;align-items:center;justify-content:center;flex:none;">
          <span data-icon="${m.icon}" style="color:${iconColor};"></span>
        </div>
        <div>
          <div style="font-weight:700;font-size:13.5px;">${m.title}</div>
          <div class="muted small">${m.subtitle}</div>
        </div>
      </div>
      <div class="row-actions" style="flex:none;display:flex;align-items:center;gap:8px;">
        <button class="btn btn-outline btn-sm" data-dismiss="${n.kind}:${n.id}" title="Dismiss this notification"><span data-icon="x" data-icon-size="14"></span></button>
      </div>
    </div>`;
}

function renderNotices() {
  const section = document.getElementById("noticeSection");
  const notices = buildNotices();
  if (!notices.length) {
    section.innerHTML = `
      <div class="inline-flex" style="gap:14px;align-items:center;">
        <span data-icon="check-circle" style="color:var(--teal-600);" data-icon-size="22"></span>
        <div>
          <h3 class="h3" style="margin-bottom:2px;">All caught up</h3>
          <p class="muted small">Nothing needs your attention right now.</p>
        </div>
      </div>`;
    return;
  }
  section.innerHTML = `
    <div class="section-head"><h3 class="h3">Notifications (${notices.length})</h3></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">
      ${ notices.map(renderNoticeRow).join("") }
    </div>`;
  wireNoticeRows(section);
  mountIcons(section);
}

function wireNoticeRows(section) {
  section.querySelectorAll("[data-notice]").forEach((row) => {
    const [kind, id] = row.dataset.notice.split(":");
    row.addEventListener("click", () => handleNoticeClick(kind, id, row.dataset.notice));
  });
  section.querySelectorAll("[data-dismiss]").forEach((b) => b.addEventListener("click", async (e) => {
    e.stopPropagation();
    const key = b.dataset.dismiss;
    setBusy(b, true);
    try {
      await dismissNotice(key);
      dismissedKeys.add(key);
      renderNotices();
    } catch (err) {
      toast(err.message || "Couldn't dismiss this notification.", "error");
      setBusy(b, false);
    }
  }));
}

async function handleNoticeClick(kind, id, key) {
  // Mark it seen before navigating away -- best-effort; a slow/failed
  // write here should never block the admin from actually opening the
  // thing they clicked on.
  try { await markNoticeSeen(key); } catch { /* ignore */ }
  // Every notice kind just jumps to the real page and opens that item's
  // own detail dialog there -- deciding (approve/reject a partner,
  // moderate a post/review, accept a suggestion) only ever happens on
  // that page, never from this feed.
  if (kind === "partner_request" || kind === "partner_decision") { location.href = `insurance.html?tab=partners&focus=${id}`; return; }
  // Suggestions live on Places Management, not Content Moderation — see
  // attractions.html's "Place Suggestions" tab.
  if (kind === "suggestion") { location.href = `attractions.html?tab=suggestions&focus=${ id }`; return; }
  if (kind === "post_report") { location.href = `content-moderation.html?tab=posts&focus=${id}`; return; }
  if (kind === "review_report") { location.href = `content-moderation.html?tab=reviews&focus=${id}`; return; }
}

function recentAt(p) {
  return p.rejectedAt || p.approvedAt || p.createdAt || null;
}

</script>
</body>
</html>
